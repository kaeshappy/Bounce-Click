<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bounce Click: un círculo que rebota. Haz clic en él para sumar puntos." />
  <title>Bounce Click</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game">
    <header class="game__header">
      <div class="game__brand">
        <span class="game__logo" aria-hidden="true"></span>
        <h1>Bounce Click</h1>
      </div>
      <p class="game__hint">Haz clic en el círculo para sumar puntos</p>
    </header>

    <section class="scoreboard" aria-label="Marcador">
      <div class="scoreboard__score">
        <span class="scoreboard__label">Puntuación</span>
        <span class="scoreboard__value" id="score">0</span>
      </div>
      <button class="restart" id="restart" type="button">Reiniciar</button>
    </section>

    <section class="arena" id="arena" aria-label="Área de juego">
      <div
        class="ball"
        id="ball"
        role="button"
        tabindex="0"
        aria-label="Círculo que rebota. Haz clic o pulsa Enter para sumar un punto."
      ></div>
    </section>

    <footer class="game__footer">HTML · CSS · JavaScript puro</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
